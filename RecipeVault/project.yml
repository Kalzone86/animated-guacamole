name: RecipeVault
options:
  bundleIdPrefix: com.sjkalz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  RecipeVault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RecipeVault
    info:
      path: RecipeVault/Info.plist
      properties:
        CFBundleDisplayName: RecipeVault
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "RecipeVault needs access to your photos so you can add a picture to a recipe."
    entitlements:
      path: RecipeVault/RecipeVault.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.sjkalz.RecipeVault
        com.apple.developer.icloud-services:
          - CloudKit
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sjkalz.RecipeVault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  RecipeVault:
    build:
      targets:
        RecipeVault: all
    run:
      config: Debug
    archive:
      config: Release
